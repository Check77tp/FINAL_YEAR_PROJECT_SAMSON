# Continuous integration: runs on every push and pull request.
#
#   server  -> unit tests + integration tests (no database or secrets needed:
#              the database and external services are faked in the tests)
#   client  -> lint + production build (catches import/JSX/CSS errors)
#
# A red X on a commit means something is broken BEFORE it reaches the live
# site. Netlify/Render can also be configured to deploy only when this passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (service layer business rules)
        run: npm run test:unit

      - name: Integration tests (routes -> services -> repositories)
        run: npm run test:integration

  client:
    name: Client lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Any value works: it is only baked into the bundle, never contacted in CI.
          VITE_API_BASE_URL: http://localhost:5000/api
