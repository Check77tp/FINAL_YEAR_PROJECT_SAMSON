<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-surface-variant": "#40493d", "secondary-container": "#acf4a4", "surface-container-low": "#f5f3f3", "primary-fixed-dim": "#88d982", "secondary": "#2a6b2c", "surface-container-high": "#eae8e7", "error": "#ba1a1a", "on-primary-container": "#cbffc2", "background": "#fbf9f8", "on-secondary-fixed": "#002203", "surface-tint": "#1b6d24", "on-primary-fixed": "#002204", "inverse-surface": "#303030", "primary-fixed": "#a3f69c", "on-tertiary-fixed": "#1a1c1c", "on-secondary-container": "#307231", "surface-container-lowest": "#ffffff", "surface": "#fbf9f8", "secondary-fixed": "#acf4a4", "outline": "#707a6c", "on-tertiary": "#ffffff", "tertiary": "#545656", "on-tertiary-container": "#f1f1f1", "on-error": "#ffffff", "on-primary-fixed-variant": "#005312", "tertiary-container": "#6c6e6e", "surface-dim": "#dcd9d9", "tertiary-fixed-dim": "#c6c6c7", "on-secondary": "#ffffff", "on-error-container": "#93000a", "tertiary-fixed": "#e2e2e2", "outline-variant": "#bfcaba", "surface-container": "#f0eded", "surface-bright": "#fbf9f8", "on-surface": "#1b1c1c", "primary-container": "#2e7d32", "error-container": "#ffdad6", "on-background": "#1b1c1c", "inverse-on-surface": "#f2f0f0", "on-secondary-fixed-variant": "#0c5216", "surface-variant": "#e4e2e1", "primary": "#0d631b", "on-primary": "#ffffff", "secondary-fixed-dim": "#91d78a", "surface-container-highest": "#e4e2e1", "on-tertiary-fixed-variant": "#454747", "inverse-primary": "#88d982" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "stack-md": "16px", "stack-lg": "24px", "stack-sm": "8px", "gutter-mobile": "12px", "touch-target-min": "44px", "margin-mobile": "16px" }, "fontFamily": { "headline-md-mobile": ["Source Serif 4"], "label-caps": ["Source Sans 3"], "body-md": ["Source Sans 3"], "body-lg": ["Source Sans 3"], "button-text": ["Source Sans 3"], "headline-sm-mobile": ["Source Serif 4"], "headline-lg-mobile": ["Source Serif 4"] } } } }</script><style>

      min-height: max(884px, 100dvh);

  </head><body class="bg-background pt-safe pb-safe"><main class="bg-background min-h-screen"><div class="flex flex-col w-full h-full pb-safe">
<!-- Hero Image Section -->
<div class="relative w-full h-64 shrink-0 bg-surface-container-high">
<div class="w-full h-full bg-cover bg-center" data-alt="A wide, sweeping shot of the University of Zambia (UNZA) main campus at dawn, featuring the iconic administration building and Great East Road campus structures. The scene is lit with warm, authoritative morning light, conveying a sense of institution, stability, and academic rigor. Subtle green branding tones are reflected in the landscape." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCg5pCZLDg1C857xMJL0qHewqpBtzMoQFsNw5LanrCELe4n1lOtCxWu11hV2Qqc6b1Lbk9mGsVA6wHB5A75S4rmUQGVSHcJuBFdHE52DwByk-bO9DezLN4wT3oYUeDXrRFxjTSlyYog_PgFZpzJ4Hs6a6bQAkejezZHvC9eno_xRzno4aZ-rSRK3g_gj9rgLw34enMM3EHB6wrq9-wcssdQSAUSm1lZPmLA9ovQ1aFC-4oNng74ZKg')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent"></div>
<div class="absolute bottom-stack-md left-margin-mobile right-margin-mobile">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-stack-sm text-shadow-sm">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access the UNZA Facilities Maintenance Portal.</p>
</div>
</div>
<!-- Login Form Section -->
<div class="flex-1 px-margin-mobile pt-stack-lg pb-stack-lg flex flex-col justify-between">
<form class="flex flex-col gap-stack-lg w-full max-w-sm mx-auto" onsubmit="event.preventDefault(); document.getElementById('login-btn').innerHTML='Signing in...'; setTimeout(() =&gt; document.getElementById('login-btn').innerHTML='Sign In', 1500);">
<div class="flex flex-col gap-stack-md">
<!-- ID Input -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-background px-1 font-label-caps text-label-caps text-primary z-10" for="userId">Student / Staff ID</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-DEFAULT border border-outline group-focus-within:border-primary transition-colors h-[56px]">
<span class="material-symbols-outlined text-outline ml-3 mr-2">badge</span>
<input autocomplete="username" class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant px-2 h-full" id="userId" placeholder="Enter your ID number" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="relative group">
<label class="absolute -top-2 left-3 bg-background px-1 font-label-caps text-label-caps text-primary z-10" for="password">Password</label>
<div class="relative flex items-center bg-surface-container-lowest rounded-DEFAULT border border-outline group-focus-within:border-primary transition-colors h-[56px]">
<span class="material-symbols-outlined text-outline ml-3 mr-2">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant px-2 h-full" id="password" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="p-3 text-outline hover:text-primary transition-colors h-full flex items-center justify-center" onclick="const p=document.getElementById('password'); const i=this.querySelector('span'); if(p.type==='password'){p.type='text'; i.textContent='visibility_off';}else{p.type='password'; i.textContent='visibility';}" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end w-full">
<a class="font-body-md text-body-md text-primary font-semibold hover:underline p-2 -mr-2" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-stack-md mt-stack-md">
<button class="w-full h-[56px] min-h-[44px] bg-primary rounded-DEFAULT flex items-center justify-center font-button-text text-button-text text-on-primary shadow-sm hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all" id="login-btn" type="submit">
                    Sign In
                </button>
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink-0 mx-4 font-body-md text-body-md text-on-surface-variant">or</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<button class="w-full h-[56px] min-h-[44px] bg-transparent border border-outline rounded-DEFAULT flex items-center justify-center font-button-text text-button-text text-primary hover:bg-surface-container-low active:scale-[0.98] transition-all" type="button">
                    Sign up as Student
                </button>
</div>
</form>
<!-- Footer Info -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant opacity-80 text-sm">
                By signing in, you agree to UNZA's <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
</div>
</div>
</div></main></body></html>
