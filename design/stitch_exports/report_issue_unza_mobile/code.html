<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&amp;family=Source+Serif+4:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-surface-variant": "#40493d", "secondary-container": "#acf4a4", "surface-container-low": "#f5f3f3", "primary-fixed-dim": "#88d982", "secondary": "#2a6b2c", "surface-container-high": "#eae8e7", "error": "#ba1a1a", "on-primary-container": "#cbffc2", "background": "#fbf9f8", "on-secondary-fixed": "#002203", "surface-tint": "#1b6d24", "on-primary-fixed": "#002204", "inverse-surface": "#303030", "primary-fixed": "#a3f69c", "on-tertiary-fixed": "#1a1c1c", "on-secondary-container": "#307231", "surface-container-lowest": "#ffffff", "surface": "#fbf9f8", "secondary-fixed": "#acf4a4", "outline": "#707a6c", "on-tertiary": "#ffffff", "tertiary": "#545656", "on-tertiary-container": "#f1f1f1", "on-error": "#ffffff", "on-primary-fixed-variant": "#005312", "tertiary-container": "#6c6e6e", "surface-dim": "#dcd9d9", "tertiary-fixed-dim": "#c6c6c7", "on-secondary": "#ffffff", "on-error-container": "#93000a", "tertiary-fixed": "#e2e2e2", "outline-variant": "#bfcaba", "surface-container": "#f0eded", "surface-bright": "#fbf9f8", "on-surface": "#1b1c1c", "primary-container": "#2e7d32", "error-container": "#ffdad6", "on-background": "#1b1c1c", "inverse-on-surface": "#f2f0f0", "on-secondary-fixed-variant": "#0c5216", "surface-variant": "#e4e2e1", "primary": "#0d631b", "on-primary": "#ffffff", "secondary-fixed-dim": "#91d78a", "surface-container-highest": "#e4e2e1", "on-tertiary-fixed-variant": "#454747", "inverse-primary": "#88d982" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "stack-md": "16px", "stack-lg": "24px", "stack-sm": "8px", "gutter-mobile": "12px", "touch-target-min": "44px", "margin-mobile": "16px" }, "fontFamily": { "headline-md-mobile": ["Source Serif 4"], "label-caps": ["Source Sans 3"], "body-md": ["Source Sans 3"], "body-lg": ["Source Sans 3"], "button-text": ["Source Sans 3"], "headline-sm-mobile": ["Source Serif 4"], "headline-lg-mobile": ["Source Serif 4"] } } } }</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; } .pb-safe { padding-bottom: env(safe-area-inset-bottom); } .pt-safe { padding-top: env(safe-area-inset-top); } } </style><style>
    body {

  </head><body class="bg-background text-on-background font-body-md"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-4 flex items-center gap-2"><button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span></button><h1 class="text-headline-sm-mobile font-headline-sm-mobile text-on-surface truncate">Report Issue</h1><div class="ml-auto w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="pt-16 pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full relative">
<!-- Floating Success Toast (Hidden by default) -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-primary-container text-on-primary-container px-4 py-2 rounded-full shadow-lg flex items-center gap-2 transform -translate-y-12 opacity-0 transition-all duration-300 pointer-events-none" id="success-toast">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-button-text font-button-text">Issue reported successfully</span>
</div>
<form class="flex flex-col p-4 gap-stack-lg" id="issue-form" onsubmit="event.preventDefault(); submitForm();">
<!-- Location Details Section -->
<section class="flex flex-col gap-stack-md bg-surface-container-low p-4 rounded-xl shadow-sm">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">location_on</span>
<h2 class="text-headline-sm-mobile font-headline-sm-mobile text-on-surface">Location Details</h2>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="text-label-caps font-label-caps text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10" for="hostel-select">HOSTEL</label>
<select class="w-full h-touch-target-min bg-transparent outline-none ring-1 ring-outline text-body-lg font-body-lg text-on-surface rounded-lg px-4 appearance-none focus:ring-2 focus:ring-primary transition-all" id="hostel-select" required="">
<option disabled="" selected="" value="">Select your hostel</option>
<option value="alpha">Alpha Hall</option>
<option value="beta">Beta Hall</option>
<option value="gamma">Gamma Residence</option>
<option value="delta">Delta Annex</option>
</select>
<div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<div class="flex flex-col gap-stack-sm relative mt-2">
<label class="text-label-caps font-label-caps text-on-surface-variant absolute -top-2 left-3 bg-surface-container-low px-1 z-10" for="room-input">ROOM NUMBER</label>
<input class="w-full h-touch-target-min bg-transparent outline-none ring-1 ring-outline text-body-lg font-body-lg text-on-surface rounded-lg px-4 focus:ring-2 focus:ring-primary transition-all placeholder:text-on-surface-variant/50" id="room-input" placeholder="e.g. 402B" required="" type="text"/>
</div>
</section>
<!-- Issue Category Section -->
<section class="flex flex-col gap-stack-md">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-[20px]">category</span>
<h2 class="text-headline-sm-mobile font-headline-sm-mobile text-on-surface">Category</h2>
</div>
<div class="grid grid-cols-3 gap-3">
<!-- Category: Electricity -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" required="" type="radio" value="electricity"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">bolt</span>
<span class="text-label-caps font-label-caps text-center">Electricity</span>
</div>
</label>
<!-- Category: Water -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="water"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">water_drop</span>
<span class="text-label-caps font-label-caps text-center">Water</span>
</div>
</label>
<!-- Category: Plumbing -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="plumbing"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">plumbing</span>
<span class="text-label-caps font-label-caps text-center">Plumbing</span>
</div>
</label>
<!-- Category: Furniture -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="furniture"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">chair</span>
<span class="text-label-caps font-label-caps text-center">Furniture</span>
</div>
</label>
<!-- Category: Internet -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="internet"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">wifi</span>
<span class="text-label-caps font-label-caps text-center">Internet</span>
</div>
</label>
<!-- Category: Other -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="category" type="radio" value="other"/>
<div class="flex flex-col items-center justify-center p-3 h-24 rounded-xl bg-surface-container shadow-sm peer-checked:bg-primary-container peer-checked:text-on-primary-container text-on-surface-variant transition-all duration-200 peer-checked:shadow-md peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2">
<span class="material-symbols-outlined text-[28px] mb-2 transition-transform duration-200 peer-checked:scale-110" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
<span class="text-label-caps font-label-caps text-center">Other</span>
</div>
</label>
</div>
</section>
<!-- Priority Section -->
<section class="flex flex-col gap-stack-md bg-surface-container-low p-4 rounded-xl shadow-sm">
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">warning</span>
<h2 class="text-headline-sm-mobile font-headline-sm-mobile text-on-surface">Priority Level</h2>
</div>
<div class="flex gap-2">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="flex items-center justify-center h-touch-target-min rounded-lg ring-1 ring-outline text-on-surface-variant bg-transparent peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:ring-0 transition-all duration-200">
<span class="text-button-text font-button-text">Routine</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="medium"/>
<div class="flex items-center justify-center h-touch-target-min rounded-lg ring-1 ring-outline text-on-surface-variant bg-transparent peer-checked:bg-secondary-container peer-checked:text-on-secondary-container peer-checked:ring-0 transition-all duration-200">
<span class="text-button-text font-button-text">Urgent</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="flex items-center justify-center h-touch-target-min rounded-lg ring-1 ring-error text-error bg-transparent peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:ring-0 transition-all duration-200">
<span class="text-button-text font-button-text">Emergency</span>
</div>
</label>
</div>
<p class="text-body-md font-body-md text-on-surface-variant text-xs opacity-80 mt-1">
        * Emergency issues will alert duty staff immediately.
      </p>
</section>
<!-- Description Section -->
<section class="flex flex-col gap-stack-sm relative mt-2">
<label class="text-label-caps font-label-caps text-on-surface-variant absolute -top-2 left-3 bg-surface px-1 z-10" for="description">DESCRIPTION</label>
<textarea class="w-full bg-transparent outline-none ring-1 ring-outline text-body-lg font-body-lg text-on-surface rounded-lg p-4 focus:ring-2 focus:ring-primary transition-all resize-none placeholder:text-on-surface-variant/50" id="description" placeholder="Please describe the issue in detail..." required="" rows="3"></textarea>
</section>
<!-- Photo Upload Section -->
<section class="flex flex-col gap-stack-md mt-2">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-primary text-[20px]">photo_camera</span>
<h2 class="text-headline-sm-mobile font-headline-sm-mobile text-on-surface">Attach Photo</h2>
<span class="text-label-caps font-label-caps text-on-surface-variant ml-auto bg-surface-container px-2 py-1 rounded-md">OPTIONAL</span>
</div>
<div class="relative w-full h-40 rounded-xl bg-surface-container-high ring-1 ring-outline border-dashed flex flex-col items-center justify-center gap-2 cursor-pointer overflow-hidden group hover:bg-surface-variant transition-colors" onclick="document.getElementById('file-upload').click()">
<!-- Placeholder content -->
<div class="flex flex-col items-center justify-center pointer-events-none transition-opacity duration-300" id="upload-placeholder">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-on-primary-container">add_a_photo</span>
</div>
<span class="text-body-md font-body-md text-on-surface-variant font-semibold">Tap to upload photo</span>
<span class="text-label-caps font-label-caps text-on-surface-variant/70">JPG, PNG up to 5MB</span>
</div>
<!-- Preview image (hidden initially) -->
<img alt="Preview" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300" id="image-preview" src=""/>
<input accept="image/*" class="hidden" id="file-upload" onchange="handleImageUpload(event)" type="file"/>
</div>
</section>
<!-- Submit Button -->
<div class="mt-4 pb-4">
<button class="w-full h-touch-target-min bg-primary text-on-primary rounded-full flex items-center justify-center gap-2 shadow-md active:scale-[0.98] transition-transform overflow-hidden relative" id="submit-btn" type="submit">
<span class="text-button-text font-button-text" id="submit-text">Submit Request</span>
<span class="material-symbols-outlined text-[20px]" id="submit-icon">send</span>
<!-- Loading spinner (hidden) -->
<div class="absolute inset-0 bg-primary flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-200" id="loading-spinner">
<svg class="animate-spin h-5 w-5 text-on-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
</button>
</div>
</form>
<script>
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const preview = document.getElementById('image-preview');
          const placeholder = document.getElementById('upload-placeholder');
          
          preview.src = e.target.result;
          preview.classList.remove('opacity-0');
          placeholder.classList.add('opacity-0');
        }
        reader.readAsDataURL(file);
      }
    }

    function submitForm() {
      const form = document.getElementById('issue-form');
      if(!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const btn = document.getElementById('submit-btn');
      const text = document.getElementById('submit-text');
      const icon = document.getElementById('submit-icon');
      const spinner = document.getElementById('loading-spinner');
      const toast = document.getElementById('success-toast');

      // Show loading state
      text.style.opacity = '0';
      icon.style.opacity = '0';
      spinner.classList.remove('opacity-0');
      btn.disabled = true;

      // Simulate network request
      setTimeout(() => {
        // Reset button
        text.style.opacity = '1';
        icon.style.opacity = '1';
        spinner.classList.add('opacity-0');
        btn.disabled = false;
        
        // Reset form visually (keep room/hostel for convenience in real app, but resetting here)
        form.reset();
        
        // Reset image preview
        document.getElementById('image-preview').classList.add('opacity-0');
        document.getElementById('upload-placeholder').classList.remove('opacity-0');

        // Show toast
        toast.classList.remove('opacity-0', '-translate-y-12');
        toast.classList.add('translate-y-0');

        // Hide toast after delay
        setTimeout(() => {
          toast.classList.add('opacity-0', '-translate-y-12');
          toast.classList.remove('translate-y-0');
        }, 3000);

      }, 1500);
    }
  </script>
</div></main></body></html>
